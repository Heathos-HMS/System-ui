name: Build Docker Image

# Run this workflow every time you push code
on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your code onto the build server
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Log in to Docker Hub using your saved credentials
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Build the Docker image and push it to Docker Hub
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: baanyo/heathos-app:v2